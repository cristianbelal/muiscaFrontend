<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MUISCA</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MUISCA: transformaciones dirigidas por modelos para contratos inteligentes" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Configuración del entorno (URL del backend); se genera en cada despliegue -->
    <script src="config.js"></script>
    <!-- Google Identity Services: botón "Iniciar sesión con Google" (POST /oauth/google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; padding: 16px; text-align: center; font-family: Roboto, sans-serif; color: #44474e; }
      .boot-spinner { width: 40px; height: 40px; border: 4px solid #d8e2ff; border-top-color: #005cbb;
        border-radius: 50%; animation: boot-spin 0.9s linear infinite; }
      .boot-slow { max-width: 42ch; font-size: 0.9rem; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="mat-typography">
    <app-root>
      <!-- Se muestra hasta que Angular arranca; en el plan gratuito el backend puede tardar en despertar. -->
      <div class="boot" role="status">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>Cargando MUISCA…</p>
        <p id="boot-slow" class="boot-slow" hidden>
          El servidor se está activando. La primera carga después de un rato sin uso puede tardar hasta 2 minutos.
        </p>
      </div>
    </app-root>
    <script>
      setTimeout(function () {
        var slow = document.getElementById('boot-slow');
        if (slow) slow.hidden = false;
      }, 5000);
    </script>
  </body>
</html>
